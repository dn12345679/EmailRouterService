name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - name: Write config/config.js from secret
        shell: bash
        run: printf '%s' "$CONFIG_JS_CONTENT" > config/config.js
        env:
          CONFIG_JS_CONTENT: ${{ secrets.CONFIG_JS_CONTENT }}

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
